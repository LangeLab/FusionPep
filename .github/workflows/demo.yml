name: Demo

# Builds the demo from the bundled example: the full output folder (report,
# figures, tables) and the screenshots used by the README and wiki. The result
# is always uploaded as the "fusionpep-demo" artifact; it is also deployed to
# GitHub Pages once Pages is enabled with "GitHub Actions" as its source.
on:
  push:
    branches: [main]
    paths:
      - "R/**"
      - "report/**"
      - "input/**"
      - "run_fusion_mapper.R"
      - "renv.lock"
      - ".github/scripts/build_demo.sh"
      - ".github/scripts/demo_images.py"
      - ".github/workflows/demo.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build demo
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read R version from renv.lock
        id: r
        shell: bash
        run: echo "version=$(python3 -c 'import json; print(json.load(open("renv.lock"))["R"]["Version"])')" >> "$GITHUB_OUTPUT"

      - name: Set up R ${{ steps.r.outputs.version }}
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: ${{ steps.r.outputs.version }}
          use-public-rspm: false

      - name: Restore project library
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: renv/library
          key: renv-${{ runner.os }}-${{ runner.arch }}-r${{ steps.r.outputs.version }}-${{ hashFiles('renv.lock') }}
          restore-keys: renv-${{ runner.os }}-${{ runner.arch }}-r${{ steps.r.outputs.version }}-

      - name: Install zlib headers for Bioconductor source builds
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends zlib1g-dev

      - name: Install locked dependencies
        run: Rscript setup_renv.R

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install Chromium for screenshots
        run: uv run --with playwright==1.63.0 playwright install --with-deps chromium

      - name: Build demo site and images
        run: bash .github/scripts/build_demo.sh "$RUNNER_TEMP/demo/site" "$RUNNER_TEMP/demo/images"

      - name: Upload demo
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fusionpep-demo
          path: ${{ runner.temp }}/demo/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Pages site
        if: github.event.repository.has_pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/demo/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event.repository.has_pages && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write # Publishes the Pages deployment.
      id-token: write # Pages verifies the deployment with OIDC.
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
